[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "night-scout"
version = "0.1.0"
description = "An overnight scout that reads the feeds you'd doom-scroll and leaves you next steps for your own projects, judged by local Gemma."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Sai Xiong" }]
dependencies = [
  "httpx>=0.27",
  "feedparser>=6.0",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "starlette>=0.39",  # FileResponse answers Range requests (Safari's <audio> needs 206s)
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "youtube-transcript-api>=1.0",
  "markdown-it-py>=3.0",
  "keyring>=25",
  "pypdf>=4",
]

[project.urls]
Homepage = "https://github.com/saixiong/nightscout"
Issues = "https://github.com/saixiong/nightscout/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]
# Whole-channel search for Scout key terms without a YouTube Data API key
youtube = ["yt-dlp>=2026.8.19"]
# Listen to your Digest: Kokoro reads it aloud, on this machine (about 1.1 GB with PyTorch)
voice = ["kokoro>=0.9.4", "soundfile>=0.12"]

[project.scripts]
night-scout = "night_scout.cli:main"

[tool.setuptools.packages.find]
include = ["night_scout*"]

[tool.setuptools.package-data]
"night_scout.web" = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
